<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI, Arial, sans-serif"><rect width="980" height="560" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><text x="30" y="34" text-anchor="start" font-size="20" font-weight="700" fill="#1f2f6b">MindSync - System Architecture (no external AI)</text><rect x="30" y="90" width="200" height="150" rx="8" fill="#eef3ff" stroke="#3b5bdb" stroke-width="1.6"/><text x="130.0" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">React + Vite SPA</text><text x="130.0" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Landing, Login, Register</text><text x="130.0" y="154" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Dashboard, tasks, energy</text><text x="130.0" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Recommendation card</text><text x="130.0" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Wellbeing check</text><text x="130.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Study planner</text><text x="130.0" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Guest mode (localStorage)</text><rect x="300" y="60" width="440" height="420" rx="8" fill="#f5f8ff" stroke="#3b5bdb" stroke-width="1.6"/><text x="520" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">FastAPI backend (Python)</text><rect x="320" y="100" width="190" height="70" rx="8" fill="#fff" stroke="#3b5bdb" stroke-width="1.6"/><text x="415.0" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Auth + security</text><text x="415.0" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Argon2id, JWT, rate limits</text><rect x="530" y="100" width="190" height="70" rx="8" fill="#fff" stroke="#3b5bdb" stroke-width="1.6"/><text x="625.0" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Tasks / Energy</text><text x="625.0" y="146" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Pydantic validation</text><rect x="320" y="190" width="190" height="90" rx="8" fill="#ecfdf3" stroke="#2f9e44" stroke-width="1.6"/><text x="415.0" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">/recommend</text><text x="415.0" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#333">formula: 0.6 deadline</text><text x="415.0" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#333">+ 0.4 energy match</text><text x="415.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#333">Burnout Mode</text><rect x="530" y="190" width="190" height="90" rx="8" fill="#ecfdf3" stroke="#2f9e44" stroke-width="1.6"/><text x="625.0" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Task-fit model</text><text x="625.0" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#333">logistic regression</text><text x="625.0" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#333">JSON weights (simulated data)</text><rect x="320" y="300" width="190" height="90" rx="8" fill="#ecfdf3" stroke="#2f9e44" stroke-width="1.6"/><text x="415.0" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Wellbeing model</text><text x="415.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#333">multinomial logistic reg.</text><text x="415.0" y="364" text-anchor="middle" font-size="12" font-weight="400" fill="#333">trained on survey data</text><rect x="530" y="300" width="190" height="90" rx="8" fill="#ecfdf3" stroke="#2f9e44" stroke-width="1.6"/><text x="625.0" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Study planner</text><text x="625.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#333">rule-based difficulty</text><text x="625.0" y="364" text-anchor="middle" font-size="12" font-weight="400" fill="#333">focus / break blocks</text><rect x="320" y="405" width="400" height="56" rx="8" fill="#ecfdf3" stroke="#2f9e44" stroke-width="1.6"/><text x="520.0" y="429" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">explain.py</text><text x="520.0" y="451" text-anchor="middle" font-size="12" font-weight="400" fill="#333">builds the explanation sentences from the scores (local code)</text><rect x="790" y="150" width="160" height="130" rx="8" fill="#fff7e6" stroke="#f08c00" stroke-width="1.6"/><text x="870.0" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">PostgreSQL</text><text x="870.0" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#333">users, tasks,</text><text x="870.0" y="214" text-anchor="middle" font-size="12" font-weight="400" fill="#333">energy_checkins,</text><text x="870.0" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#333">wellbeing_checks</text><rect x="790" y="320" width="160" height="70" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><text x="870.0" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2f6b">Offline training</text><text x="870.0" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#333">scikit-learn scripts</text><text x="870.0" y="384" text-anchor="middle" font-size="12" font-weight="400" fill="#333">ml_training/</text><line x1="230" y1="165" x2="300" y2="165" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="265" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#555">HTTPS + JWT</text><line x1="740" y1="215" x2="790" y2="215" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="765" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="#555">asyncpg</text><line x1="790" y1="355" x2="740" y2="355" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="765" y="345" text-anchor="middle" font-size="11" font-weight="400" fill="#555">weights JSON</text><text x="30" y="515" text-anchor="start" font-size="12" font-weight="400" fill="#333">Green = machine-learning or rules code that runs on our own server. Nothing is sent to an outside AI service.</text><text x="30" y="535" text-anchor="start" font-size="12" font-weight="400" fill="#333">Training happens offline; the running app only loads the saved JSON weights, so no ML library is needed at run time.</text></svg>